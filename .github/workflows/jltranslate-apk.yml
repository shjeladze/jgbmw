name: Build JL Translate Android APK
on:
  push:
    paths:
      - 'JLTranslate_Android/**'
      - '.github/workflows/jltranslate-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android API 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: JLTranslate_Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy APK
        run: cp JLTranslate_Android/app/build/outputs/apk/debug/app-debug.apk JLTranslate-v1.0.apk
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLTranslate-Android-APK
          path: JLTranslate-v1.0.apk
          if-no-files-found: error
      - name: Release direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view jltranslate-android-v1.0 >/dev/null 2>&1 || gh release create jltranslate-android-v1.0 --title "JL Translate Android v1.0" --notes "Standalone Android APK. Install and grant permissions inside the app. Not affiliated with WhatsApp."
          gh release upload jltranslate-android-v1.0 JLTranslate-v1.0.apk --clobber
