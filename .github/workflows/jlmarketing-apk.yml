name: Build JL Programmer Marketing APK
on:
  push:
    branches:
      - jl-programmer-marketing-android-20261111
    paths:
      - 'JLMarketing_Android/**'
      - '.github/workflows/jlmarketing-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated Android branch
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: JLMarketing_Android
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp JLMarketing_Android/app/build/outputs/apk/debug/app-debug.apk JL-Programmer-Marketing-v1.0.apk
      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JL-Programmer-Marketing-APK
          path: JL-Programmer-Marketing-v1.0.apk
          if-no-files-found: error
      - name: Publish APK in a distinct release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view jl-programmer-marketing-v1.0 >/dev/null 2>&1 || gh release create jl-programmer-marketing-v1.0 --title "JL Programmer Marketing Android v1.0" --notes "Android app: 97 sourced business contacts by country, logo/banner editor, Gmail compose. Manual send only; requires documented recipient marketing consent. No Google API or bulk sending." --target "${GITHUB_SHA}"
          gh release upload jl-programmer-marketing-v1.0 JL-Programmer-Marketing-v1.0.apk --clobber
